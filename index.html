<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Speak & Learn!</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Speak & Learn">
  <link rel="apple-touch-icon" href="https://fav.farm/⭐">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', sans-serif;
      background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 500px;
    }

    .lang-toggle {
      display: flex;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 4px;
      gap: 5px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 6px 14px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .lang-btn.active {
      background: #3742fa;
      color: white;
      box-shadow: 0 4px 10px rgba(55, 66, 250, 0.3);
    }

    h1 {
      color: #fff;
      text-shadow: 2px 3px 0px #ff4757;
      font-size: 1.8rem;
      margin: 5px 0;
    }

    .mic-button {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #ff4757;
      border: 6px solid #ffffff;
      box-shadow: 0 10px 25px rgba(255, 71, 87, 0.5);
      color: white;
      font-size: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
      outline: none;
      margin: 10px 0;
    }

    .mic-button.listening {
      background: #2ed573;
      animation: pulse 1.2s infinite;
      box-shadow: 0 10px 25px rgba(46, 213, 115, 0.6);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .status-text {
      font-size: 1.1rem;
      color: #2f3542;
      font-weight: bold;
      min-height: 28px;
      margin: 4px 0;
      text-align: center;
    }

    .display-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      padding: 15px;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      flex-grow: 1;
      max-height: 52vh;
    }

    .number-figure {
      font-size: 4rem;
      line-height: 1.1;
      font-weight: 900;
      color: #3742fa;
      text-shadow: 3px 3px 0px #ffa502;
      text-transform: capitalize;
      text-align: center;
    }

    .sub-word {
      font-size: 1.6rem;
      color: #ff4757;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    .items-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      align-content: center;
      width: 100%;
      overflow-y: auto;
      padding: 8px;
      flex-grow: 1;
    }

    .item-icon {
      font-size: 5rem;
      animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* Quick Suggestion Bar */
    .quick-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      width: 100%;
      max-width: 500px;
      padding: 10px 0;
    }

    .quick-btn {
      flex: 1;
      min-width: 65px;
      height: 42px;
      background: #ffffff;
      border: 2px solid #70a1ff;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      color: #3742fa;
      cursor: pointer;
      white-space: nowrap;
    }

    .quick-btn:active {
      background: #70a1ff;
      color: white;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>Speak & Learn!</h1>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btnEn" onclick="setLanguage('en-US')">🇬🇧 EN</button>
      <button class="lang-btn" id="btnFr" onclick="setLanguage('fr-FR')">🇫🇷 FR</button>
    </div>
  </div>

  <button class="mic-button" id="micBtn" onclick="toggleListening()">🎤</button>
  <div class="status-text" id="statusText">Tap the mic and say a word or number!</div>

  <div class="display-card">
    <div class="number-figure" id="mainDisplay">Cat</div>
    <div class="sub-word" id="subDisplay">🐱 Chat</div>
    <div class="items-grid" id="itemsGrid"></div>
  </div>

  <div class="quick-bar" id="quickBar">
    <!-- Populated dynamically based on language -->
  </div>

  <script>
    let currentLang = 'en-US';
    let isListening = false;
    let recognition = null;

    // Words & Picture Emoji Map
    const dictionary = {
      // English / French Picture mappings
      'cat': { emoji: '🐱', frWord: 'Chat', frInput: 'chat' },
      'chat': { emoji: '🐱', enWord: 'Cat', isFr: true },
      'dog': { emoji: '🐶', frWord: 'Chien', frInput: 'chien' },
      'chien': { emoji: '🐶', enWord: 'Dog', isFr: true },
      'apple': { emoji: '🍎', frWord: 'Pomme', frInput: 'pomme' },
      'pomme': { emoji: '🍎', enWord: 'Apple', isFr: true },
      'sun': { emoji: '☀️', frWord: 'Soleil', frInput: 'soleil' },
      'soleil': { emoji: '☀️', enWord: 'Sun', isFr: true },
      'car': { emoji: '🚗', frWord: 'Voiture', frInput: 'voiture' },
      'voiture': { emoji: '🚗', enWord: 'Car', isFr: true },
      'star': { emoji: '⭐', frWord: 'Étoile', frInput: 'étoile' },
      'étoile': { emoji: '⭐', enWord: 'Star', isFr: true },
      'fish': { emoji: '🐟', frWord: 'Poisson', frInput: 'poisson' },
      'poisson': { emoji: '🐟', enWord: 'Fish', isFr: true },
      'ball': { emoji: '⚽', frWord: 'Ballon', frInput: 'ballon' },
      'ballon': { emoji: '⚽', enWord: 'Ball', isFr: true },
      'flower': { emoji: '🌸', frWord: 'Fleur', frInput: 'fleur' },
      'fleur': { emoji: '🌸', enWord: 'Flower', isFr: true },
      'bird': { emoji: '🐦', frWord: 'Oiseau', frInput: 'oiseau' },
      'oiseau': { emoji: '🐦', enWord: 'Bird', isFr: true },
      'house': { emoji: '🏠', frWord: 'Maison', frInput: 'maison' },
      'maison': { emoji: '🏠', enWord: 'House', isFr: true },
      'book': { emoji: '📚', frWord: 'Livre', frInput: 'livre' },
      'livre': { emoji: '📚', enWord: 'Book', isFr: true }
    };

    const frNumbers = { 1: "Un", 2: "Deux", 3: "Trois", 4: "Quatre", 5: "Cinq", 6: "Six", 7: "Sept", 8: "Huit", 9: "Neuf", 10: "Dix" };
    const enNumbers = { 1: "One", 2: "Two", 3: "Three", 4: "Four", 5: "Five", 6: "Six", 7: "Seven", 8: "Eight", 9: "Nine", 10: "Ten" };

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function initRecognition() {
      if (!SpeechRecognition) return;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = currentLang;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
        document.getElementById('statusText').innerText = currentLang === 'fr-FR' ? "Écoute en cours... Parlez !" : "Listening... Say something!";
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase().trim();
        document.getElementById('statusText').innerText = `"${transcript}"`;
        processInput(transcript);
      };
    }

    function processInput(input) {
      // Check if input is a number
      let foundNum = parseInt(input);
      if (!isNaN(foundNum) && foundNum >= 1 && foundNum <= 100) {
        showNumber(foundNum);
        return;
      }

      // Check if input matches dictionary word
      const cleanWord = input.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
      if (dictionary[cleanWord]) {
        showWord(cleanWord);
      } else {
        // Fallback: Display whatever word she said!
        showCustomWord(cleanWord);
      }
    }

    function showNumber(num) {
      document.getElementById('mainDisplay').innerText = num;
      const word = currentLang === 'fr-FR' ? (frNumbers[num] || `Nombre ${num}`) : (enNumbers[num] || `Number ${num}`);
      document.getElementById('subDisplay').innerText = word;
      renderIcons('⭐', num);
      speak(currentLang === 'fr-FR' ? (frNumbers[num] || num.toString()) : `${num}!`);
    }

    function showWord(wordKey) {
      const entry = dictionary[wordKey];
      
      if (currentLang === 'fr-FR') {
        const frWord = entry.isFr ? wordKey : entry.frWord;
        const enWord = entry.enWord || wordKey;
        document.getElementById('mainDisplay').innerText = frWord;
        document.getElementById('subDisplay').innerText = `🇬🇧 ${enWord}`;
        renderIcons(entry.emoji, 1);
        speak(frWord);
      } else {
        const enWord = entry.isFr ? entry.enWord : wordKey;
        const frWord = entry.frWord || wordKey;
        document.getElementById('mainDisplay').innerText = enWord;
        document.getElementById('subDisplay').innerText = `🇫🇷 ${frWord}`;
        renderIcons(entry.emoji, 1);
        speak(enWord);
      }
    }

    function showCustomWord(word) {
      document.getElementById('mainDisplay').innerText = word;
      document.getElementById('subDisplay').innerText = "✨ Say it loud!";
      renderIcons('🎨', 1);
      speak(word);
    }

    function renderIcons(emoji, count) {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';
      
      if (count === 1) {
        const span = document.createElement('span');
        span.className = 'item-icon';
        span.innerText = emoji;
        grid.appendChild(span);
      } else {
        let fontSize = count > 20 ? '1.4rem' : '2rem';
        for (let i = 0; i < count; i++) {
          const span = document.createElement('span');
          span.className = 'item-icon';
          span.style.fontSize = fontSize;
          span.innerText = emoji;
          grid.appendChild(span);
        }
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btnEn').classList.toggle('active', lang === 'en-US');
      document.getElementById('btnFr').classList.toggle('active', lang === 'fr-FR');
      
      document.getElementById('statusText').innerText = lang === 'fr-FR' ? "Dites un mot ou un nombre !" : "Say a word or number!";
      
      populateQuickBar();
      initRecognition();
      showWord(lang === 'fr-FR' ? 'chat' : 'cat');
    }

    function populateQuickBar() {
      const quickBar = document.getElementById('quickBar');
      quickBar.innerHTML = '';
      const items = currentLang === 'fr-FR' 
        ? ['chat', 'chien', 'pomme', 'soleil', '5', '10']
        : ['cat', 'dog', 'apple', 'sun', '5', '10'];

      items.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'quick-btn';
        btn.innerText = item.toUpperCase();
        btn.onclick = () => processInput(item);
        quickBar.appendChild(btn);
      });
    }

    function toggleListening() {
      if (!recognition) initRecognition();
      if (!recognition) return;
      
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = currentLang;
        utterance.pitch = 1.2;
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Initial Setup
    initRecognition();
    populateQuickBar();
    showWord('cat');
  </script>
</body>
</html>
