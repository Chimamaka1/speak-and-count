<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Speak & Count!</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Speak & Count">
  <link rel="apple-touch-icon" href="https://fav.farm/⭐">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', sans-serif;
      background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    h1 {
      color: #fff;
      text-shadow: 2px 3px 0px #ff4757;
      font-size: 2rem;
      margin: 5px 0;
    }

    .mic-button {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #ff4757;
      border: 6px solid #ffffff;
      box-shadow: 0 10px 25px rgba(255, 71, 87, 0.5);
      color: white;
      font-size: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
      outline: none;
    }

    .mic-button.listening {
      background: #2ed573;
      animation: pulse 1.2s infinite;
      box-shadow: 0 10px 25px rgba(46, 213, 115, 0.6);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .status-text {
      font-size: 1.2rem;
      color: #2f3542;
      font-weight: bold;
      min-height: 28px;
      margin: 8px 0;
      text-align: center;
    }

    .display-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      padding: 15px;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      flex-grow: 1;
      max-height: 55vh;
    }

    .number-figure {
      font-size: 6.5rem;
      line-height: 1;
      font-weight: 900;
      color: #3742fa;
      text-shadow: 4px 4px 0px #ffa502;
      margin-bottom: 5px;
    }

    .items-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      align-content: flex-start;
      width: 100%;
      overflow-y: auto;
      padding: 10px;
    }

    .item-icon {
      animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* Fallback Quick Buttons */
    .quick-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      width: 100%;
      max-width: 500px;
      padding: 10px 0;
    }

    .num-btn {
      flex: 1;
      min-width: 50px;
      height: 45px;
      background: #ffffff;
      border: 2px solid #70a1ff;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #3742fa;
      cursor: pointer;
    }

    .num-btn:active {
      background: #70a1ff;
      color: white;
    }
  </style>
</head>
<body>

  <h1>Speak & Count! 🎙️</h1>

  <button class="mic-button" id="micBtn" onclick="toggleListening()">🎤</button>
  <div class="status-text" id="statusText">Tap the mic and say a number! (1 - 100)</div>

  <div class="display-card">
    <div class="number-figure" id="numberDisplay">10</div>
    <div class="items-grid" id="itemsGrid"></div>
  </div>

  <div class="quick-bar">
    <button class="num-btn" onclick="setNumber(10)">10</button>
    <button class="num-btn" onclick="setNumber(25)">25</button>
    <button class="num-btn" onclick="setNumber(50)">50</button>
    <button class="num-btn" onclick="setNumber(75)">75</button>
    <button class="num-btn" onclick="setNumber(100)">100</button>
  </div>

  <script>
    let currentNumber = 10;
    let isListening = false;
    let recognition = null;

    // Advanced Word to Number Parser (supports 1 - 100)
    const ones = {
      'zero':0, 'one':1, 'two':2, 'to':2, 'too':2, 'three':3, 'four':4, 'for':4, 
      'five':5, 'six':6, 'seven':7, 'eight':8, 'ate':8, 'nine':9, 'ten':10,
      'eleven':11, 'twelve':12, 'thirteen':13, 'fourteen':14, 'fifteen':15,
      'sixteen':16, 'seventeen':17, 'eighteen':18, 'nineteen':19
    };
    const tens = {
      'twenty':20, 'thirty':30, 'forty':40, 'fifty':50, 
      'sixty':60, 'seventy':70, 'eighty':80, 'ninety':90, 'hundred':100
    };

    function parseSpokenText(text) {
      // 1. Check direct digit match (e.g. "45")
      const matches = text.match(/\d+/);
      if (matches) return parseInt(matches[0]);

      // 2. Parse word combinations (e.g. "twenty five" or "ninety nine")
      const words = text.toLowerCase().replace(/-/g, ' ').split(' ');
      let total = 0;
      let temp = 0;

      for (let word of words) {
        if (ones[word] !== undefined) {
          temp += ones[word];
        } else if (tens[word] !== undefined) {
          if (word === 'hundred') {
            temp = (temp || 1) * 100;
          } else {
            temp += tens[word];
          }
        }
      }
      total += temp;
      return total > 0 ? total : null;
    }

    // Setup Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
        document.getElementById('statusText').innerText = "Listening... Say a number!";
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase().trim();
        document.getElementById('statusText').innerText = `You said: "${transcript}"`;
        
        const foundNum = parseSpokenText(transcript);

        if (foundNum !== null && foundNum >= 1 && foundNum <= 100) {
          setNumber(foundNum);
        } else if (foundNum > 100) {
          document.getElementById('statusText').innerText = "Try a number up to 100!";
          speak("Try a smaller number up to 100!");
        } else {
          speak("I didn't catch a number. Try again!");
        }
      };
    } else {
      document.getElementById('statusText').innerText = "Voice input isn't supported on this browser. Use the buttons below!";
    }

    function toggleListening() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function setNumber(num) {
      currentNumber = num;
      document.getElementById('numberDisplay').innerText = num;
      renderStars(num);
      speak(`${num}!`);
    }

    function renderStars(count) {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';
      const icons = ['⭐', '🎈', '🍎', '🐱', '🚀'];
      const chosenIcon = icons[count % icons.length];

      // Dynamically size icons based on count so 100 fit nicely!
      let fontSize = '2rem';
      if (count > 50) fontSize = '1.2rem';
      else if (count > 20) fontSize = '1.5rem';

      for (let i = 0; i < count; i++) {
        const span = document.createElement('span');
        span.className = 'item-icon';
        span.style.fontSize = fontSize;
        span.innerText = chosenIcon;
        grid.appendChild(span);
      }
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.pitch = 1.2;
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Initial render
    renderStars(10);
  </script>
</body>
</html>
