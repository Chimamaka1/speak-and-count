<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>French Voice Friend (Gemini)</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Learn French">
  <link rel="apple-touch-icon" href="https://fav.farm/🇫🇷">

  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 15px;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', sans-serif;
      background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; color: #fff;
    }

    h1 { margin: 5px 0; font-size: 1.8rem; text-shadow: 2px 2px 0 #000; }

    /* API Key Box */
    .key-bar {
      width: 100%; max-width: 500px; display: flex; gap: 8px; margin-bottom: 8px;
    }
    .key-input {
      flex: 1; padding: 10px 12px; border-radius: 12px; border: none; font-size: 0.9rem;
    }
    .save-btn {
      background: #2ecc71; color: white; border: none; padding: 10px 15px;
      border-radius: 12px; font-weight: bold; cursor: pointer;
    }

    /* Main Display Card */
    .card {
      background: rgba(255, 255, 255, 0.95); color: #2c3e50;
      border-radius: 24px; padding: 20px; width: 100%; max-width: 500px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      min-height: 280px; justify-content: center; margin: 10px 0; flex-grow: 1;
    }

    .ai-text { font-size: 1.5rem; font-weight: bold; color: #2980b9; line-height: 1.3; }
    .user-said { font-size: 1.1rem; color: #7f8c8d; margin-top: 15px; font-style: italic; }

    /* Mic Controls */
    .mic-container { display: flex; flex-direction: column; align-items: center; margin: 10px 0; }
    .mic-button {
      width: 110px; height: 110px; border-radius: 50%; background: #e74c3c;
      border: 5px solid #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      color: white; font-size: 3rem; display: flex; align-items: center;
      justify-content: center; cursor: pointer; outline: none; transition: 0.2s;
    }
    .mic-button.listening { background: #2ecc71; animation: pulse 1.2s infinite; }
    .mic-button.thinking { background: #f39c12; animation: spin 1s infinite linear; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .status { margin-top: 8px; font-size: 1.1rem; font-weight: bold; text-shadow: 1px 1px 0 #000; }
  </style>
</head>
<body>

  <h1>French Voice Friend 🇫🇷</h1>

  <!-- Gemini Key Input -->
  <div class="key-bar" id="keyBar">
    <input type="password" id="apiKeyInput" class="key-input" placeholder="Paste Gemini API Key (AIzaSy...)" />
    <button class="save-btn" onclick="saveKey()">Save Key</button>
  </div>

  <div class="card">
    <div class="ai-text" id="aiText">Bonjour! Tap the mic to start talking to me! 🎈</div>
    <div class="user-said" id="userSaid">I am ready to learn French!</div>
  </div>

  <div class="mic-container">
    <button class="mic-button" id="micBtn" onclick="toggleMic()">🎤</button>
    <div class="status" id="statusText">Tap to start talking</div>
  </div>

  <script>
    let apiKey = localStorage.getItem('gemini_key') || '';
    let isListening = false;
    let recognition = null;
    
    // Conversation History formatted for Gemini API
    let conversationHistory = [];

    const systemPrompt = "You are a warm, playful, and encouraging French tutor for a 4-year-old girl. Speak in short, simple 1-sentence responses. Teach her French words, numbers, and phrases in a fun tone. Always ask her to repeat a simple word back to you to keep the conversation flowing!";

    if (apiKey) {
      document.getElementById('keyBar').style.display = 'none';
    }

    function saveKey() {
      const input = document.getElementById('apiKeyInput').value.trim();
      if (input.startsWith('AIzaSy')) {
        apiKey = input;
        localStorage.setItem('gemini_key', input);
        document.getElementById('keyBar').style.display = 'none';
        alert('Gemini Key saved! Tap the mic to begin.');
      } else {
        alert('Please enter a valid Gemini API key starting with AIzaSy');
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function initSpeech() {
      if (!SpeechRecognition) {
        alert("Speech recognition is not supported on this browser.");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        const btn = document.getElementById('micBtn');
        btn.className = 'mic-button listening';
        btn.innerText = '🎙️';
        document.getElementById('statusText').innerText = "Listening to you...";
      };

      recognition.onend = () => {
        isListening = false;
      };

      recognition.onresult = (event) => {
        const userText = event.results[0][0].transcript;
        document.getElementById('userSaid').innerText = `You said: "${userText}"`;
        sendToGemini(userText);
      };
    }

    async function sendToGemini(userText) {
      if (!apiKey) {
        alert("Please enter your Gemini API Key at the top first!");
        return;
      }

      const btn = document.getElementById('micBtn');
      btn.className = 'mic-button thinking';
      btn.innerText = '⚙️';
      document.getElementById('statusText').innerText = "Gemini is thinking...";

      // Append user's turn
      conversationHistory.push({
        role: "user",
        parts: [{ text: userText }]
      });

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemPrompt }] },
            contents: conversationHistory
          })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const aiReply = data.candidates[0].content.parts[0].text.trim();

          // Save assistant response to history
          conversationHistory.push({
            role: "model",
            parts: [{ text: aiReply }]
          });

          document.getElementById('aiText').innerText = aiReply;
          speakReply(aiReply);
        } else {
          throw new Error("Invalid response from Gemini API");
        }
      } catch (err) {
        console.error(err);
        document.getElementById('statusText').innerText = "Error connecting to Gemini API.";
        btn.className = 'mic-button';
        btn.innerText = '🎤';
      }
    }

    function speakReply(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.88; 
      utterance.pitch = 1.1;

      utterance.onend = () => {
        // Continuous Voice Loop: Automatically turn mic back on after Gemini speaks!
        document.getElementById('micBtn').className = 'mic-button';
        document.getElementById('micBtn').innerText = '🎤';
        setTimeout(() => {
          if (recognition && !isListening) {
            recognition.start();
          }
        }, 600);
      };

      window.speechSynthesis.speak(utterance);
    }

    function toggleMic() {
      if (!recognition) initSpeech();
      if (!recognition) return;

      if (isListening) {
        recognition.stop();
        document.getElementById('micBtn').className = 'mic-button';
        document.getElementById('micBtn').innerText = '🎤';
      } else {
        recognition.start();
      }
    }

    initSpeech();
  </script>
</body>
</html>
